name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found" >&2
            exit 1
          fi
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .project-extracted
          unzip -q "${{ steps.zip.outputs.zip }}" -d .project-extracted
          if [ -d .project-extracted/fabrics-apk-project ]; then
            shopt -s dotglob
            cp -a .project-extracted/fabrics-apk-project/. ./
          else
            shopt -s dotglob
            cp -a .project-extracted/. ./
          fi
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download lz-string
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/lib
          curl -fsSL --retry 3 --retry-delay 2 \
            https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js \
            -o app/src/main/assets/lib/lz-string.min.js
          test -s app/src/main/assets/lib/lz-string.min.js

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fabrics-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
